name: Publicar Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar mercado5
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Autenticar Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OFERTAS_V2 }}

      - name: Instalar dependencias de funciones
        run: npm install --prefix functions

      - name: Publicar Hosting, reglas y funciones
        run: npx --yes firebase-tools@latest deploy --only hosting,database,functions --project ofertas-v2 --non-interactive
